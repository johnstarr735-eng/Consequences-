name: Install prepared Consequences update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out your current main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Apply the prepared source update
        id: update
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check <<'CHECKSUM'
          1d8c65508952b380ff4faa96f3566ab08095562e231e144ad433a7f2d5ddbd5a  ollama-integration.patch
          CHECKSUM
          git merge-base --is-ancestor b8e81cff548310099b214d02e01f17448fb3c9ce HEAD
          branch="manual/ollama-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.autocrlf false
          git am --3way --keep-cr --whitespace=nowarn ollama-integration.patch
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Run the gameplay and AI provider tests
        run: node --test tests/*.test.mjs

      - name: Publish the update branch
        env:
          UPDATE_BRANCH: ${{ steps.update.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${UPDATE_BRANCH}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Your update is ready to review

          The game source and selectable Ollama provider have been restored on a new branch. The gameplay and AI provider tests passed.

          [Review and merge the update](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${UPDATE_BRANCH}?expand=1)

          Click **Create pull request**, then **Merge pull request** and **Confirm merge** to add the update to main.

          This updates the repository's source. Running Ollama on your PC and connecting a hosted game remain separate setup steps.
          EOF
